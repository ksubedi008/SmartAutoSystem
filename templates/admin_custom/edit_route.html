{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm bg-body-tertiary border-0 rounded-4 p-4">
                <div class="card-body">
                    <h3 class="text-center fw-bold mb-1">Edit Route</h3>
                    <p class="text-center text-muted mb-4">{{ route.source.name }} ➝ {{ route.destination.name }}</p>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-3 shadow-sm mt-3">Update Route</button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="{% url 'admin_routes' %}" class="text-decoration-none fw-bold text-muted">Cancel</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('input, select, textarea').forEach(function(el) { el.classList.add('form-control'); });
    });
</script>
{% endblock %}
