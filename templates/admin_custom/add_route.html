{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm bg-body-tertiary border-0 rounded-4 p-4">
                <div class="card-body">
                    <h3 class="text-center fw-bold mb-4">Add New Route</h3>
                    <form method="post">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small fw-bold mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-3 shadow-sm mt-3">Save Route</button>
                    </form>
                    <div class="text-center mt-4">
                        <a href="{% url 'admin_routes' %}" class="text-decoration-none fw-bold text-muted">← Back to Routes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('input, select, textarea').forEach(function(el) { el.classList.add('form-control'); });
    });
</script>
{% endblock %}
