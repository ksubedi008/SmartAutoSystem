{% extends 'base.html' %}

{% block content %}
<style>
    .admin-form-box {
        background-color: #4e2a8e;
        color: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        max-width: 500px;
        margin: 40px auto;
    }

    /* Style the dropdowns/inputs */
    .admin-form-box input, 
    .admin-form-box select {
        width: 100%;
        padding: 12px;
        border-radius: 5px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background-color: rgba(255, 255, 255, 0.9);
        color: #333;
        margin-bottom: 15px;
    }
    
    .admin-form-box label {
        font-weight: bold;
        margin-bottom: 5px;
        display: block;
    }

    .custom-hr {
        border-color: rgba(255, 255, 255, 0.3);
        margin-bottom: 25px;
    }
</style>

<div class="container">
    <div class="admin-form-box">
        <h3 class="text-center fw-bold"> Add New Route</h3>
        <hr class="custom-hr">
        
        <form method="post">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-warning small fw-bold">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}
            
            <button type="submit" class="btn btn-warning w-100 fw-bold shadow btn-lg mt-3">
                Save Route
            </button>
        </form>
        
        <div class="text-center mt-4">
            <a href="{% url 'admin_routes' %}" class="text-white text-decoration-none fw-bold">
                ← Back to Routes
            </a>
        </div>
    </div>
</div>
{% endblock %}
