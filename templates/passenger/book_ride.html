{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card shadow-sm bg-body-tertiary border-0 rounded-4 p-4">
                <div class="card-body">
                    <h2 class="text-center fw-bold mb-4">Book Your Auto</h2>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Pickup Location</label>
                            <select name="source" class="form-select form-select-lg" required>
                                <option value="" selected disabled>Select Pickup Point...</option>
                                {% for location in locations %}
                                    <option value="{{ location.id }}">{{ location.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold">Drop Location</label>
                            <select name="destination" class="form-select form-select-lg" required>
                                <option value="" selected disabled>Select Destination...</option>
                                {% for location in locations %}
                                    <option value="{{ location.id }}">{{ location.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="alert alert-warning border-warning border-2 rounded-3 text-center mb-4">
                            Standard Rate: <strong class="fs-5">Rs. 30 per km</strong>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-3 rounded-3 shadow-sm text-uppercase mb-3">
                            Find Driver Now
                        </button>
                        
                        <div class="text-center">
                            <a href="{% url 'passenger_dashboard' %}" class="text-muted fw-bold text-decoration-none">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
