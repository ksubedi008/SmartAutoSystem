{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm bg-body-tertiary border-0 rounded-4 p-4">
                <div class="card-body">
                    <h2 class="text-center fw-bold mb-4">Finish Ride</h2>

                    <div class="card shadow-sm border-start border-info border-5 bg-body-secondary mb-4 p-3">
                        <div class="mb-2">
                            <span class="text-muted small fw-bold text-uppercase d-block">Passenger</span>
                            <span class="fw-bold fs-5">{{ booking.passenger.username }}</span>
                        </div>
                        <div class="mb-2">
                            <span class="text-muted small fw-bold text-uppercase d-block">Route</span>
                            <span class="fw-bold fs-5">{{ booking.source.name }} ➝ {{ booking.destination.name }}</span>
                        </div>
                        <div>
                            <span class="text-muted small fw-bold text-uppercase d-block">Estimated Fare</span>
                            <span class="fw-bold fs-5 text-warning">Rs. {{ booking.estimated_fare }}</span>
                        </div>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-4 text-start">
                            <label class="form-label fw-bold">Actual Distance (km)</label>
                            <input type="number" step="0.1" name="actual_distance" class="form-control form-control-lg" placeholder="e.g. 5.5" required>
                            <div class="form-text mt-2">* Enter the exact reading from your odometer</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-3 rounded-3 shadow-sm text-uppercase">
                            Calculate Bill & Finish
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
